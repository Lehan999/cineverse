<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}Cineverse{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">Cineverse</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="#">Movies</a>
            <a href="#">Genres</a>
            <a href="#">My List</a>
        </div>

        <div class="nav-right">
            <input
                type="text"
                placeholder="Search movies..."
                class="search-box"
            >

            <button class="sign-in-button">
                Sign In
            </button>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>
</html>
